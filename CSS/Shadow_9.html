<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Outline</title>
    <style>
        .box {
            padding: 34px;
            background-color: aquamarine;
            color: red;
            box-shadow: 2px 2px 4px black;
            text-shadow: 2px 2px 4px rgb(149, 113, 5);
        }
    </style>
</head>

<body>
    <div class="box">I am the box</div>
</body>

</html>
