<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling the list</title>
    <style>
        
        nav ul li{
            
        /* Styling counting(1,2,3) in list */
            list-style: devanagari;

        /*Including the numbers of list inside the background to change its color*/
            list-style-position: inside;
            background-color: aqua;

        /*Replacing marker with an image*/
            list-style-image:url(List\ Image.png) ;
            
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>
</html>
