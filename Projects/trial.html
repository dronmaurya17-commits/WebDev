<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Youtube Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            border: 4px solid rgb(216, 219, 20);
            border-radius: 14px;
            width: 45vw;
            background-color: rgb(206, 207, 182);
            padding: 5px;
            gap: 10px;
        }

        /* ✅ THE KEY: position: relative on parent */
        .img {
            position: relative;
            width: fit-content;
        }

        .img img {
            display: block;
            width: 250px;
            border-radius: 7px;
            border: 2px solid rgb(51, 51, 182);
        }

        /* ✅ THE KEY: position: absolute on timestamp */
        .bottom-right {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: black;
            color: white;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .text {
            font-size: 16px;
            font-style: italic;
            font-family: cursive;
            padding: 7px;
            background-color: rgb(207, 201, 146);
            border: 2px solid rgb(177, 177, 110);
            border-radius: 7px;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="img">
            <img src="https://i.ytimg.com/vi/UzYRQURh_pY/hqdefault.jpg" alt="Video">
            <span class="bottom-right">21:34</span>
        </div>

        <span class="text">
            JavaScript Exercise 13 - solutions & shoutouts | <b>Sigma Web Development Course</b>
        </span>
    </div>
</body>
</html>
