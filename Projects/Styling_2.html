<!-- Write the HTML and CSS code to style a para inside a div contains 5 other paras.Dont use the class function -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excercise 2</title>
    <style>
        p{
            color:white;
            background-color: blue;
        }

        div p:first-child{
            background-color: yellow;
            color: red;
        }
    </style>
</head>
<body>
    <div>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Unde sint illo, hic totam non odit accusantium nulla voluptatibus reiciendis necessitatibus nobis distinctio recusandae.</p>
        <p>I am para number 2</p>
        <p>I am para number 3</p>
    </div>

     <div>
        <p>para number 4</p>
        <p>I am para number 5</p>
        <p>I am para number 6</p>
    </div>
</body>
</html>
