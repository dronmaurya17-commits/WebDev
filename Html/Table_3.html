<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table>
        <!-- Adding caption -->
        <caption>Student Details</caption>

        <!-- table header -->
         <thead>Table header: at top of table</thead>
        
        <tr>
            <th>Name</th>
            <th>Class</th>
            <th>Roll No.</th>
        </tr>

        <tr>
            <td>Doerone</td>
            <td>6th</td>
            <td>bhul gya</td>
        </tr>

        <!-- Colspan for columns space -->
        <tr>
            <td colspan="2">2 col mere</td>
            <td>23</td>
        </tr>

        <!-- Table footer -->
         <tfoot>Table footer: at bottom of table</tfoot>
    </table>
</body>
</html>
