<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in Html</title>
</head>
<body>
    <h1>Apply Neet form here</h1>
    <form action="post">

        <!-- User input form -->
        <div>
        <label for="username">Enter name</label>
        <input type="text" id="username" name="username" placeholder="Enter your user name">
        </div>

        <!-- Choose option form -->
         <div>
            <input type="radio" id="Male" name="Gender" value="Male">
            <label for="Male">Male</label>
            <input type="radio" name="Gender" id="Female">
            <label for="Female">Female</label>
         </div>

         <!-- Checkbox -->
          <div>
            <input type="checkbox" id="Gay" name="Ajeeb Prani" value="Gay">
            <label for="Gay">Gay</label>
            <input type="checkbox" name="Ajeeb Prani" id="Lesbian">
            <label for="Lesbian">Lesbain</label>
            <input type="checkbox" name="Ajeeb Prani" id="Dono hu">
            <label for="Dono hu">Dono hu</label>
          </div>

          <!-- Text Area -->
           <div>
            <textarea name="comment" rows="4" cols="20">Enter the comment here in text area
            </textarea>
           </div>

           <!-- Select Tag -->
            <div>
                <select name="Fruits">
                    <option value="Apple">Apple</option>
                    <option value="Banana">Banana</option>
                    <option value="Guava">Guava</option>
                </select>
            </div>
    </form>
</body> 
</html>
